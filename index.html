</html><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">Estudante Exemplo • 9º Ano</p>
    </header>

    <!-- Área de Cards de Resumo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media-geral" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-total-faltas" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="card-atencao" class="card-valor">—</p>
      </div>

      <div class="card highlight">
        <h3>Frequência Geral</h3>
        <p id="card-frequencia" class="card-valor">92%</p>
        <span class="card-subtexto">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela Responsiva de Disciplinas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-boletim">
          <!-- O JavaScript vai preencher as linhas aqui -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
